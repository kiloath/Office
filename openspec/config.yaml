schema: spec-driven

context: |
  ## 專案目的
  
  ## 環境與共用規則
  - 動手前先讀根目錄 `AGENTS.md`（shell、node/fnm、pnpm、uv、回覆語言）。

  ## 程式分析
  - 如果在分析的過程裡需要我提供更多的資料請明說不要用猜的，例如需要LOG檔,程式碼,組態檔,圖檔等。

  ## 目錄架構

  - **動手改任何檔案前，先讀 `Book/docs/help/folders.md`。**
    那一頁是目錄架構與操作權限的唯一來源：各目錄放什麼、哪些禁止操作、
    以及目前還沒有結論的待確認事項。這裡刻意不重複，避免兩邊走鐘。
  - 有一部分目錄是使用者手動維護、禁止操作也不需要檢查的。
    清單在那一頁，**不要憑記憶或憑目錄名稱判斷**。
  - 我可能啟用多種 AI Agent（`.agent`、`.agents`、`.claude`、`.devin`），
    請在建立 SKILL 時要同步，不要單獨改其中一份。

  ## 撰寫慣例

  - 只使用 mkdocs.yml 已啟用的 Markdown 擴充：mermaid（superfences）、KaTeX（arithmatex，$$）、
    admonition、details、tasklist、tabbed、footnotes、def_list、abbr、attr_list、md_in_html、tables。
    未啟用的語法（snippets、critic 等）不要用。
  - markdown 文件，圖檔請依.vscode/settings.json 裡的設定儲存。

  ## 版控

  - 不需要去 commit 或 push。
  - 切換支線失敗時請使用者處理。
